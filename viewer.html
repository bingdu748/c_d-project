<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 文档</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  body { margin: 0; background: #f6f8fa; color: #1f2328;
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 32px auto; background: #fff; padding: 40px 48px;
         box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 8px; line-height: 1.7; }
  h1, h2, h3 { margin-top: 1.4em; line-height: 1.3; }
  h1 { font-size: 1.7em; } h2 { font-size: 1.4em; } h3 { font-size: 1.2em; }
  code { background: #f0f2f5; padding: 2px 5px; border-radius: 4px; font-size: .9em; }
  pre { background: #f6f8fa; padding: 14px; border-radius: 6px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; overflow-x: auto; display: block; max-width: 100%; }
  th, td { border: 1px solid #d0d7de; padding: 6px 12px; }
  th { background: #f6f8fa; }
  blockquote { color: #57606a; border-left: 4px solid #d0d7de; margin: 0; padding-left: 14px; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; }
  hr { border: none; border-top: 1px solid #d0d7de; }
  sup.fn-ref a { font-weight: 600; }
  .math-display { overflow-x: auto; padding: 6px 0; }
  .footnotes { font-size: .88em; color: #57606a; border-top: 1px solid #d0d7de; margin-top: 2em; padding-top: .8em; }
  .footnotes ol { padding-left: 1.4em; }
  .footnotes .fn-back { margin-left: .4em; text-decoration: none; color: #57606a; }
  #err { color: #cf222e; }
</style>
</head>
<body>
<main>
  <div id="content">加载中…</div>
  <p id="err"></p>
</main>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var src = params.get('src');
    var title = params.get('title');
    var out = document.getElementById('content');
    var errBox = document.getElementById('err');

    function fail(msg) {
      out.textContent = '';
      errBox.textContent = '加载失败：' + msg;
    }
    if (!src) { fail('缺少 src 参数（要渲染的 markdown 地址）'); return; }

    // ===== 脚注扩展：收集定义，引用渲染为角标，定义输出到文末 =====
    var fnDefs = {};      // id -> 定义内容（markdown 原文）
    var fnOrder = [];     // 定义出现顺序

    marked.use({
      extensions: [
        {
          // 行内引用 [^id]
          name: 'fnRef',
          level: 'inline',
          start: function (src) { return src.indexOf('[^'); },
          tokenizer: function (src) {
            var m = /^\[\^([^\]]+)\]/.exec(src);
            if (!m) { return undefined; }
            return { type: 'fnRef', raw: m[0], id: m[1] };
          },
          renderer: function (token) {
            var n = fnOrder.indexOf(token.id) + 1;
            if (n <= 0) { return token.raw; }
            return '<sup class="fn-ref"><a href="#fn-' + n + '" id="fnref-' + n + '">' + n + '</a></sup>';
          }
        },
        {
          // 块级定义 [^id]: 内容（连续非空行）
          name: 'fnDef',
          level: 'block',
          start: function (src) { return src.match(/^\[\^[^\]]+\]:/) ? 0 : -1; },
          tokenizer: function (src) {
            var m = /^\[\^([^\]]+)\]:[ \t]*(.*(?:(?:\n(?!\n|\s*\[\^)[^\n]*)*))/.exec(src);
            if (!m) { return undefined; }
            var id = m[1], content = m[2].trim();
            if (content) {
              if (!(id in fnDefs)) { fnOrder.push(id); }
              fnDefs[id] = content;
            }
            return { type: 'fnDef', raw: m[0], id: id };
          },
          renderer: function () { return ''; }
        }
      ]
    });

    // ===== 数学公式预处理 =====
    // 在 marked 解析前，把 $$…$$ / \(…\) / $…$ 整段提取成占位符，
    // 避免其中的 | _ [ ] * 等被 markdown（表格/斜体/链接）误解析；
    // 解析完成后再统一替换为 KaTeX 渲染结果。
    // 占位符用 §§M编号§§，避免被 marked 当作代码/强调处理。
    var mathBlocks = [];   // { tex, display }
    function protectMath(md) {
      md = md.replace(/\$\$([\s\S]+?)\$\$/g, function (m, tex) {
        var id = mathBlocks.length;
        mathBlocks.push({ tex: tex, display: true });
        return '\u00A7\u00A7M' + id + '\u00A7\u00A7';
      });
      md = md.replace(/\\\(([\s\S]*?)\\\)/g, function (m, tex) {
        var id = mathBlocks.length;
        mathBlocks.push({ tex: tex, display: false });
        return '\u00A7\u00A7M' + id + '\u00A7\u00A7';
      });
      md = md.replace(/\$([^\n$]+)\$/g, function (m, tex) {
        var id = mathBlocks.length;
        mathBlocks.push({ tex: tex, display: false });
        return '\u00A7\u00A7M' + id + '\u00A7\u00A7';
      });
      return md;
    }
    function restoreMath(html) {
      return html.replace(/\u00A7\u00A7M(\d+)\u00A7\u00A7/g, function (m, idx) {
        var b = mathBlocks[+idx] || { tex: m, display: false };
        var tex = b.tex.replace(/\uFF1D/g, '=');  // 全角＝转半角，仅公式内有效
        if (!window.katex) { return b.display ? '<pre>' + tex + '</pre>' : tex; }
        var h = katex.renderToString(tex, { displayMode: b.display, throwOnError: false });
        return b.display ? '<div class="math-display">' + h + '</div>' : h;
      });
    }

    var url = decodeURIComponent(src);
    fetch(url)
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status + ' ' + r.statusText); }
        return r.text();
      })
      .then(function (md) {
        if (title) { document.title = title; }

        // 数学公式预处理：把 $$…$$ / \(…\) / $…$ 换成占位符，防止被 marked 误解析
        // （同时覆盖标题、表格单元格、<details> summary 中的公式）
        md = protectMath(md);

        // 折叠区预处理：提取 <details>…</details>，parse 后内部 markdown 单独渲染
        var detailsBlocks = [];
        md = md.replace(/<details>([\s\S]*?)<\/details>/gi, function (m0, inner) {
          var id = '%%DETAILS_' + detailsBlocks.length + '%%';
          detailsBlocks.push(inner);
          return id;
        });

        var html = marked.parse(md, { gfm: true, breaks: false });

        // 还原折叠区：summary 原样保留（内部公式占位符随后统一还原），
        // 其余内容按 markdown 渲染
        html = html.replace(/%%DETAILS_(\d+)%%/g, function (m0, idx) {
          var inner = detailsBlocks[+idx];
          var sumMatch = inner.match(/<summary>[\s\S]*?<\/summary>/i);
          var sum = sumMatch ? sumMatch[0] : '';
          if (sumMatch) { inner = inner.slice(sumMatch.index + sumMatch[0].length); }
          return '<details>\n' + sum + '\n' + marked.parse(inner, { gfm: true }) + '\n</details>';
        });

        // 文末追加脚注列表
        if (fnOrder.length) {
          var fnHtml = '<section class="footnotes"><hr><ol>';
          for (var i = 0; i < fnOrder.length; i++) {
            var id = fnOrder[i];
            fnHtml += '<li id="fn-' + (i + 1) + '">' +
                      marked.parseInline(fnDefs[id] || '') +
                      '<a class="fn-back" href="#fnref-' + (i + 1) + '" title="返回">↩</a></li>';
          }
          fnHtml += '</ol></section>';
          html += fnHtml;
        }

        // 公式占位符最后统一还原为 KaTeX 渲染结果
        html = restoreMath(html);
        out.innerHTML = html;

        // LaTeX 代码块（```latex / ```math / ```tex → 块级公式）
        var fenced = out.querySelectorAll('pre code.language-latex, pre code.language-math, pre code.language-tex');
        for (var j = 0; j < fenced.length; j++) {
          var pre = fenced[j].parentNode;
          var txt = fenced[j].textContent.trim();
          // 剥离包裹符：$$…$$ / $…$ / \(…\)
          txt = txt.replace(/^\$\$[ \t]*/, '').replace(/[ \t]*\$\$$/, '');
          txt = txt.replace(/^\$[ \t]*/, '').replace(/[ \t]*\$$/, '');
          txt = txt.replace(/^\\\([ \t]*/, '').replace(/[ \t]*\\\)$/, '');
          if (window.katex) {
            var div = document.createElement('div');
            katex.render(txt, div, { displayMode: true, throwOnError: false });
            pre.parentNode.replaceChild(div, pre);
          }
        }
      })
      .catch(function (e) { fail(e.message); });
  })();
</script>
</body>
</html>
